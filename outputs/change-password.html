  <section class="account-card account-login-card"><div class="account-eyebrow">БЕЗОПАСНОСТЬ АККАУНТА</div><h1>Обнови пароль</h1><p class="account-muted">Укажи текущий пароль и задай новый. Пароль должен содержать не менее 10 символов.</p>
