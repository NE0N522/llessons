<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <title>Первая настройка — Код по полочкам</title>
  <script src="assets/app/theme.js?v=account-ui-20261112"></script>
  <link rel="stylesheet" href="assets/app/accounts/accounts.css?v=account-ui-20261112">
  <script src="assets/app/accounts/ui-utils.js?v=account-ui-20261112" defer></script>
  <script src="assets/app/accounts/ui-strings.js?v=account-ui-20261112" defer></script>
  <script src="assets/app/accounts/common.js?v=account-ui-20261112" defer></script>
  <script src="assets/app/accounts/setup.js?v=account-ui-20261112" defer></script>
  <link rel="stylesheet" href="assets/app/privacy.css?v=account-ui-20261112">
</head>
<body class="account-body">
  <main class="account-login-wrap setup-wrap">
    <a class="account-brand" href="index.html"><span class="account-brand-mark" aria-hidden="true">&lt;/&gt;</span><span>код по полочкам</span></a>
    <section class="account-card account-login-card setup-card" aria-labelledby="setup-heading">
      <div class="account-eyebrow">ПЕРВАЯ НАСТРОЙКА</div>
      <h1 id="setup-heading">Создайте аккаунт учителя</h1>
      <p class="account-muted">Этот аккаунт будет владельцем курса: только ему доступна загрузка полной резервной копии.</p>
      <form class="account-form" data-setup-form>
        <label>Ваше имя и фамилия<input name="full_name" autocomplete="name" required maxlength="100"></label>
        <label>Логин<input name="login" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{2,39}" aria-describedby="login-help"><small id="login-help">Латиница, цифры, точка, дефис или подчёркивание.</small></label>
        <label>Надёжный пароль<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200" aria-describedby="password-help"><small id="password-help">От 12 символов, с буквами и цифрами. Сохраните его в надёжном месте.</small></label>
        <label class="setup-token-field">Ключ первой настройки, если он задан на сервере<input name="setup_token" autocomplete="off" maxlength="300"></label>
        <button class="account-button account-submit" type="submit">Создать аккаунт</button>
      </form>
      <p class="account-message" data-setup-message role="status" aria-live="polite"></p>
    </section>
    <a class="account-back-link" href="index.html">← К открытому курсу</a>
  </main>
<footer class="site-privacy-footer"><a class="site-privacy-link" href="privacy.html">Конфиденциальность</a></footer></body>
</html>
